name: SHAFFE Ads - Análisis semanal

on:
  # Reactivado 22/08/2026 a pedido del usuario: quiere que la info de Ads se
  # recolecte sola, sin tener que dispararlo a mano. Corrió bien todas las
  # semanas hasta que se pausó el 27/07/2026 (ver historial git de este
  # archivo). Mismo horario de siempre.
  schedule:
    - cron: '0 12 * * 1' # lunes 9:00 ART (UTC-3) = 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python main.py collect
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_SELLER_ID: ${{ secrets.ML_SELLER_ID }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Sin esto, push_ads_queue() no tiene con qué autenticarse contra
          # el ERP y las propuestas detectadas nunca llegan al panel de
          # CIOMA — agregado 22/08/2026 (secrets nuevos en este repo).
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL }}
          ERP_EMAIL: ${{ secrets.ERP_EMAIL }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}

      # ML_ACCESS_TOKEN/ML_REFRESH_TOKEN no van por Secrets: main.py los lee y
      # los reescribe en memory/ml_tokens.json (rotan en cada refresh). Por eso
      # ese archivo se commitea junto con state.json. Requiere que el repo sea privado.
      - name: Persistir estado, tokens ML y historial
        run: |
          git config user.name "shaffe-ads-bot"
          git config user.email "bot@shaffe.local"
          git add memory/state.json memory/ml_tokens.json memory/roas_history.json memory/changes_history.json
          git diff --cached --quiet || git commit -m "chore: estado y tokens tras corrida semanal"
          git pull --rebase origin main
          git push
